version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Monthly batches routine bumps; security updates don't follow this schedule.
    schedule:
      interval: "monthly"
    # Skip releases younger than 7 days so a malicious one is likely pulled first.
    cooldown:
      default-days: 7
    # The PR Title check only accepts the types in scripts/check_pr_title.py.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    # Workspace members resolve from the local tree, not PyPI.
    ignore:
      - dependency-name: "multicloud-py-*"
    # One PR per run for minor/patch and one for security fixes; majors stay
    # ungrouped so each breaking upgrade is reviewed on its own.
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
