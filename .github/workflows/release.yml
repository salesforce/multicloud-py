name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-pr:
    name: Synchronize generated release versions
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the Release Please branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Synchronize generated files
        run: |
          uv run python scripts/sync_version.py --write
          uv lock
          unexpected="$(git diff --name-only | grep -Ev '^(uv\.lock|packages/[^/]+/[^/]+/pyproject\.toml)$' || true)"
          test -z "${unexpected}"
          git add uv.lock packages/*/*/pyproject.toml
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore(release): synchronize generated versions"
            git push origin "HEAD:${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}"
          fi

  validate-release:
    name: Validate tagged release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: test "${{ needs.release-please.outputs.tag_name }}" = "multicloud-py-v$(python scripts/sync_version.py --print)"
      - run: uv lock --check
      - run: uv sync --frozen --all-groups --all-packages
      - run: uv run --frozen python -m black --check packages tests scripts
      - run: uv run --frozen python -m isort --check-only packages tests scripts
      - run: uv run --frozen python scripts/sync_version.py --check
      - run: uv run --frozen python -m pytest -m 'not conformance'
      - run: uv run --frozen python -m pytest -m conformance --record-mode=none
      - run: uv build --all-packages --no-sources --out-dir dist
      - run: uv run --frozen python -m twine check dist/*
      - run: uv run --frozen python -m scripts.validate_release_artifacts dist
      - run: uv run --frozen python -m scripts.smoke_test_release_artifacts dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-release-${{ needs.release-please.outputs.tag_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish to PyPI
    needs: [release-please, validate-release]
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.validate-release.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        project:
          - multicloud-py-common
          - multicloud-py-aws-common
          - multicloud-py-gcp-common
          - multicloud-py-blob
          - multicloud-py-blob-aws
          - multicloud-py-blob-gcp
          - multicloud-py-blob-ali
          - multicloud-py-docstore
          - multicloud-py-docstore-aws
          - multicloud-py-docstore-gcp-firestore
          - multicloud-py-iam
          - multicloud-py-iam-aws
          - multicloud-py-iam-gcp
          - multicloud-py-pubsub
          - multicloud-py-pubsub-aws
          - multicloud-py-pubsub-gcp
          - multicloud-py-pubsub-ali
          - multicloud-py-sts
          - multicloud-py-sts-aws
          - multicloud-py-sts-gcp
          - multicloud-py-sts-ali
    environment: pypi-${{ matrix.project }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-release-${{ needs.release-please.outputs.tag_name }}
          path: dist
      - name: Select this project's distributions
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          normalized_project="${PROJECT//-/_}"
          mkdir package-dist
          find dist -maxdepth 1 -type f -name "${normalized_project}-*" -exec cp {} package-dist/ \;
          test "$(find package-dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: package-dist/
          skip-existing: true
          verbose: true
