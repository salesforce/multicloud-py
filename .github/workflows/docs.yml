name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Build documentation
        run: uv run --frozen --group docs mkdocs build --strict --site-dir "$RUNNER_TEMP/documentation-site"
      - name: Upload validated website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: ${{ runner.temp }}/documentation-site
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    environment:
      name: github-pages
      url: https://opensource.salesforce.com/multicloud-py/
    concurrency:
      group: documentation-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: site
      - name: Download validated website
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: ${{ runner.temp }}/documentation-site
      - name: Verify Pages publishing source
        run: |
          set -euo pipefail
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" \
            --jq '[.build_type, .source.branch, .source.path] | join(":")')
          if [ "$source" != "legacy:site:/docs" ]; then
            echo "::error::Configure Pages to deploy from the site branch's /docs folder."
            exit 1
          fi
      - name: Update generated website
        id: publish
        run: |
          set -euo pipefail
          git fetch --no-tags origin main site
          git merge --ff-only origin/site
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping an older main build; a newer commit will publish."
            exit 0
          fi

          test -s "$RUNNER_TEMP/documentation-site/index.html"
          git rm -r --quiet --ignore-unmatch docs
          mkdir -p docs
          cp -R "$RUNNER_TEMP/documentation-site/." docs/
          touch docs/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          git add docs SOURCE_COMMIT
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: publish site from $GITHUB_SHA"
            git push origin HEAD:site
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Request Pages deployment
        if: steps.publish.outputs.ready == 'true'
        # GITHUB_TOKEN pushes do not trigger a branch-based Pages build.
        # Request one explicitly, including on a manual retry with no file changes.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
