name: PR Title (trusted base)

on:
  # Safe: run only the base revision's validator, never code from the PR.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  trusted-conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/check_pr_title.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate the trusted squash commit subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py "$TITLE"
