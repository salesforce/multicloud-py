[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multicloud-py-iam-gcp"
version = "0.1.9"
license = "Apache-2.0"
description = "Google Cloud IAM provider for multicloud-iam."
readme = {text = "MultiCloud Python SDK package.", content-type = "text/markdown"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "multicloud-py-iam>=0.1.9",
    "multicloud-py-gcp-common>=0.1.9",
    "google-cloud-iam>=2.0.0",
    "google-cloud-resource-manager>=1.8.0",
    "google-auth>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/salesforce/multicloud-py"
Repository = "https://github.com/salesforce/multicloud-py"
Issues = "https://github.com/salesforce/multicloud-py/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]

[project.entry-points."multicloud.iam.providers"]
gcp = "multicloud.iam.iam_gcp"

[tool.setuptools]
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["multicloud*"]
