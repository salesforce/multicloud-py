[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multicloud-py-docstore-aws"
version = "0.1.9"
license = "Apache-2.0"
description = "AWS DynamoDB provider for multicloud-docstore."
readme = {text = "MultiCloud Python SDK package.", content-type = "text/markdown"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "multicloud-py-docstore>=0.1.9",
    "multicloud-py-aws-common>=0.1.9",
    "boto3>=1.18.0",
    "botocore>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/salesforce/multicloud-py"
Repository = "https://github.com/salesforce/multicloud-py"
Issues = "https://github.com/salesforce/multicloud-py/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]

# The docstore client discovers providers by importing every module
# advertised under the ``multicloud.docstore.providers`` entry-point
# group. Importing this module triggers the
# ``@DOCSTORE_REGISTRY.register("aws")`` decorator on AwsDocStore,
# registering it.
[project.entry-points."multicloud.docstore.providers"]
aws = "multicloud.docstore.docstore_aws"

[tool.setuptools]
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["multicloud*"]
