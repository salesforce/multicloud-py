[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multicloud-py-pubsub-aws"
version = "0.1.9"
license = "Apache-2.0"
description = "AWS SNS/SQS provider for multicloud-pubsub."
readme = {text = "MultiCloud Python SDK package.", content-type = "text/markdown"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "multicloud-py-pubsub>=0.1.9",
    "multicloud-py-aws-common>=0.1.9",
    "boto3>=1.18.0",
    "botocore>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/salesforce/multicloud-py"
Repository = "https://github.com/salesforce/multicloud-py"
Issues = "https://github.com/salesforce/multicloud-py/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]

# Importing the module triggers both ``@TOPIC_REGISTRY.register("aws")``
# and ``@SUBSCRIPTION_REGISTRY.register("aws")`` decorators (when the
# provider impl lands), so the same module is advertised under both
# entry-point groups.
[project.entry-points."multicloud.pubsub.topic.providers"]
aws = "multicloud.pubsub.pubsub_aws"

[project.entry-points."multicloud.pubsub.subscription.providers"]
aws = "multicloud.pubsub.pubsub_aws"

[tool.setuptools]
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["multicloud*"]
