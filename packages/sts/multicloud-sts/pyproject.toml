[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multicloud-py-sts"
version = "0.1.9"
license = "Apache-2.0"
description = "Cloud-agnostic Security Token Service client for the python-multicloud SDK. Pair with a provider package (multicloud-sts-aws / -gcp / -ali) for actual cloud calls."
readme = {text = "MultiCloud Python SDK package.", content-type = "text/markdown"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "multicloud-py-common>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/salesforce/multicloud-py"
Repository = "https://github.com/salesforce/multicloud-py"
Issues = "https://github.com/salesforce/multicloud-py/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]

[tool.setuptools]
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["multicloud*"]
